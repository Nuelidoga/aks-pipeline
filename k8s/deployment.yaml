apiVersion: apps/v1
kind: Deployment
metadata:
  name: petsitting
  labels:
    app: petsitting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petsitting
  template:
    metadata:
      labels:
        app: petsitting
    spec:
      containers:
        - name: petsitting
          image: acraksei1214.azurecr.io/petsitting:v2
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10